<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="height: 48px; border: 2px solid #663399; border-radius: 999px; background: #EFE0C6; color: #663399; font-size: 15px; font-weight: 700">Yes</button>
<button aria-pressed="false" style="height: 48px; border: 1px solid #E6D5B8; border-radius: 999px; background: #FAF8F4; color: #4A3F52; font-size: 15px; font-weight: 600">No</button>
</div>
</div>

<div role="group" aria-labelledby="mq2" style="display: flex; flex-direction: column; gap: 10px">
<p id="mq2" style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Did you feel clear on what your next step in care should be?</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="false" style="height: 48px; border: 1px solid #E6D5B8; border-radius: 999px; background: #FAF8F4; color: #4A3F52; font-size: 15px; font-weight: 600">Yes</button>
<button aria-pressed="true" style="height: 48px; border: 2px solid #663399; border-radius: 999px; background: #EFE0C6; color: #663399; font-size: 15px; font-weight: 700">No</button>
</div>
</div>

<div role="group" aria-labelledby="mq3" style="display: flex; flex-direction: column; gap: 10px">
<p id="mq3" style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Did this app help you figure out or take a next step?</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="height: 48px; border: 2px solid #663399; border-radius: 999px; background: #EFE0C6; color: #663399; font-size: 15px; font-weight: 700">Yes</button>
<button aria-pressed="false" style="height: 48px; border: 1px solid #E6D5B8; border-radius: 999px; background: #FAF8F4; color: #4A3F52; font-size: 15px; font-weight: 600">No</button>
</div>
</div>

<button style="margin-top: 4px; height: 52px; border: 0; border-radius: 999px; background: #663399; color: #FFFFFF; font-size: 16px; font-weight: 700">Submit</button>
