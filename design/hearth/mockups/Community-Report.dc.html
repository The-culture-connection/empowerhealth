<head>
<meta charset="utf-8">
<title>Hearth — Report Post</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; background: #8E8794; font-family: 'Figtree', system-ui, sans-serif; color: #2D2733">
<div role="dialog" aria-labelledby="cr-title" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #F5F1E8; border-radius: 28px">

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 id="cr-title" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 22px; line-height: 28px; font-weight: 400">Report Post</h1>
<p id="cr-question" style="margin: 0; font-size: 15px; line-height: 22px; color: #4A3F52">Why are you reporting this post?</p>
</div>

<div role="radiogroup" aria-labelledby="cr-question" style="display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733"><input type="radio" name="cr-reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Inappropriate content</label>
<label style="display: flex; align-items: center; gap: 12px; padding: 15px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px; font-size: 15px; line-height: 22px; font-weight: 700; color: #2D2733"><input type="radio" name="cr-reason" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Spam</label>
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733"><input type="radio" name="cr-reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Harassment</label>
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733"><input type="radio" name="cr-reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Other</label>
</div>

<textarea aria-label="Additional details (optional)" rows="3" placeholder="Additional details (optional)" style="box-sizing: border-box; width: 100%; height: 88px; padding: 14px 16px; resize: none; font-size: 15px; line-height: 22px; color: #2D2733; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px"></textarea>

<div style="display: flex; justify-content: flex-end; gap: 12px">
<a href="Community-Post.dc.html" style="flex: none; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 22px; border: 1.5px solid #663399; border-radius: 999px; color: #663399; font-size: 16px; font-weight: 700">Cancel</a>
<button style="flex: 1; height: 52px; padding: 0 16px; border: 0; border-radius: 999px; background: #663399; color: #FFFFFF; font-size: 16px; font-weight: 700; white-space: nowrap">Submit Report</button>
</div>

</div>
</div>
</x-dc>

</html>
