<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth — Report this listing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #8E8794; font-family: 'Figtree', system-ui, sans-serif; color: #2D2733">
<div style="background: #F5F1E8; border-radius: 28px 28px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #C9B8A0"></span>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 20px; line-height: 26px; font-weight: 400">Report this listing</h1>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #4A3F52">If something looks inaccurate or harmful, tell us. This is not for medical emergencies.</p>
</div>

<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">Danielle Whitfield, CNM</p>

<div role="radiogroup" aria-labelledby="report-reason" style="display: flex; flex-direction: column; gap: 8px">
<span id="report-reason" style="font-size: 14px; line-height: 20px; font-weight: 600">Reason</span>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #EFE0C6; border: 2px solid #663399; border-radius: 18px; font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733"><input type="radio" name="reason" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Information looks wrong</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px; font-size: 15px; line-height: 22px; color: #4A3F52"><input type="radio" name="reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Harmful or unsafe content</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px; font-size: 15px; line-height: 22px; color: #4A3F52"><input type="radio" name="reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Identity / cultural tags seem wrong</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px; font-size: 15px; line-height: 22px; color: #4A3F52"><input type="radio" name="reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Spam or duplicate listing</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 12px 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px; font-size: 15px; line-height: 22px; color: #4A3F52"><input type="radio" name="reason" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399">Other</label>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="report-details" style="font-size: 14px; line-height: 20px; font-weight: 600">Details (optional)</label>
<textarea id="report-details" rows="4" placeholder="What should we know?" style="box-sizing: border-box; width: 100%; height: 108px; padding: 14px 16px; resize: none; font-size: 15px; line-height: 22px; color: #2D2733; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px"></textarea>
</div>

<button style="width: 100%; height: 52px; margin-top: 4px; border: 0; border-radius: 999px; background: #663399; color: #FFFFFF; font-size: 16px; font-weight: 700">Submit report</button>
</div>
</div>
</x-dc>

return {};
}
}

</body>
</html>
