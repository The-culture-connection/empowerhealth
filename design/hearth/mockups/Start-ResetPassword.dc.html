<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; background: #8E8794; font-family: 'Figtree', system-ui, sans-serif; color: #2D2733">

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A3F52">Enter your email address and we'll send you a password reset link.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rp-email" style="font-size: 14px; line-height: 20px; font-weight: 600">Email</label>
<input id="rp-email" type="email" placeholder="your.email@example.com" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; font-size: 15px; color: #2D2733; background: #F5F1E8; border: 1px solid #E6D5B8; border-radius: 18px">
</div>
<div style="display: flex; justify-content: flex-end; gap: 24px">
<button style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #663399; font-size: 15px; font-weight: 700">Cancel</button>
<button style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #663399; font-size: 15px; font-weight: 700">Send Reset Link</button>
</div>
</div>
</div>
