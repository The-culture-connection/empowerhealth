<button style="height: 44px; padding: 0 18px; border: 1px solid #E6D5B8; border-radius: 999px; background: #FAF8F4; color: #4A3F52; font-size: 15px; font-weight: 600">Support</button>
<button style="height: 44px; padding: 0 18px; border: 1px solid #E6D5B8; border-radius: 999px; background: #FAF8F4; color: #4A3F52; font-size: 15px; font-weight: 600">Resources</button>

<div style="display: flex; flex-direction: column; gap: 12px">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5C75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
