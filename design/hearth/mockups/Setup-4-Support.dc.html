<label style="display: flex; align-items: flex-start; gap: 14px; padding: 15px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px">

<label style="display: flex; align-items: flex-start; gap: 14px; padding: 16px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px">

<label style="display: flex; align-items: flex-start; gap: 14px; padding: 15px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px">
