<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth — Support preferences</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F1E8; color: #2D2733; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 64px 20px 8px; display: flex; flex-direction: column; gap: 16px">
<a href="Loss-Transition.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FAF8F4; border: 1px solid #E6D5B8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D2733" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 26px; line-height: 32px; font-weight: 400">What support would feel helpful right now?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A3F52">Choose anything that feels supportive today. You can skip anything you do not want to answer.</p>
</div>
</header>

<div style="padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 12px">

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px"><input type="checkbox" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Emotional or grief support</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 17px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px"><input type="checkbox" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; color: #2D2733">Understanding what happened</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px"><input type="checkbox" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Follow-up care for my body</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px"><input type="checkbox" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Help talking to my provider</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 17px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px"><input type="checkbox" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; color: #2D2733">Support for the future, if or when I’m ready</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 17px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px"><input type="checkbox" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; color: #2D2733">Practical support or resources</span></label>

<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #EFE0C6; border: 2px solid #663399; border-radius: 24px"><input type="checkbox" checked="checked" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #663399"><span style="font-size: 15px; line-height: 22px; font-weight: 600; color: #2D2733">Something else I need</span></label>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px">
<textarea aria-label="Something else I need" rows="3" maxlength="500" placeholder="Optional: only what you want to share" style="box-sizing: border-box; width: 100%; height: 96px; padding: 14px 16px; font-size: 15px; line-height: 22px; color: #2D2733; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px; resize: none"></textarea>
<span style="align-self: flex-end; font-size: 12px; line-height: 18px; color: #6B5C75">0/500</span>
</div>

</div>

<div style="margin-top: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 4px">
<button style="width: 100%; height: 52px; border: 0; border-radius: 999px; background: #663399; color: #FFFFFF; font-size: 16px; font-weight: 700">Continue</button>
<button style="align-self: center; min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-size: 15px; font-weight: 700; color: #663399">Skip for now</button>
</div>

</div>
</x-dc>

</body>
</html>
