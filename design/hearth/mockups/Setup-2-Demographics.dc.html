<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth — Create Your Profile: Demographics</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F1E8; color: #2D2733; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 64px 20px 8px; display: flex; flex-direction: column; gap: 16px">
<a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FAF8F4; border: 1px solid #E6D5B8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D2733" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 26px; line-height: 32px; font-weight: 400">Create Your Profile</h1>
</div>
</header>

<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #6B5C75">Step 2 of 7</p>
<div role="progressbar" aria-label="Profile progress" aria-valuemin="0" aria-valuemax="7" aria-valuenow="2" style="display: flex; height: 6px; border-radius: 999px; background: #E6D5B8; overflow: hidden"><span style="width: 100px; border-radius: 999px; background: #663399"></span></div>
</div>
<h2 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 20px; line-height: 26px; font-weight: 400">Demographics</h2>
</div>

<div style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 24px">

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4A3F52">Tell us a bit more about yourself.</p>

<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #4A3F52">This information helps us connect you with culturally relevant resources and support.</p>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #6B5C75">These fields are optional.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="s2-race" style="font-size: 14px; line-height: 20px; font-weight: 600">Race/Ethnicity</label>
<button id="s2-race" type="button" aria-haspopup="listbox" style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; text-align: left; font-size: 15px; color: #2D2733; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="9" cy="8" r="3.500"></circle><path d="M2.500 20c0-3.500 3-5.500 6.500-5.500s6.500 2 6.500 5.500"></path><path d="M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.800c2.200.700 3.500 2.400 3.500 5.200"></path></svg><span style="flex: 1; min-width: 0">Black or African American</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="s2-language" style="font-size: 14px; line-height: 20px; font-weight: 600">Preferred Language</label>
<button id="s2-language" type="button" aria-haspopup="listbox" style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; text-align: left; font-size: 15px; color: #2D2733; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.500 2.500 3.800 5.500 3.800 9s-1.300 6.500-3.800 9c-2.500-2.500-3.800-5.500-3.800-9S9.500 5.500 12 3z"></path></svg><span style="flex: 1; min-width: 0">English</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="s2-marital" style="font-size: 14px; line-height: 20px; font-weight: 600">Marital Status</label>
<button id="s2-marital" type="button" aria-haspopup="listbox" style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; text-align: left; font-size: 15px; color: #6B5C75; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"></path></svg><span style="flex: 1; min-width: 0">Select your marital status</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="s2-education" style="font-size: 14px; line-height: 20px; font-weight: 600">Education Level</label>
<button id="s2-education" type="button" aria-haspopup="listbox" aria-expanded="true" style="display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; height: 52px; padding: 0 15px; text-align: left; font-size: 15px; color: #2D2733; background: #FAF8F4; border: 2px solid #663399; border-radius: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2.500 9.500L12 5l9.500 4.500L12 14z"></path><path d="M6.500 11.700V16c1.500 1.400 3.400 2 5.500 2s4-.600 5.500-2v-4.300M21.500 9.500V15"></path></svg><span style="flex: 1; min-width: 0">Some college</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 15l6-6 6 6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px; background: #FAF8F4; border: 1px solid #E6D5B8; border-radius: 24px">
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">Less than high school</button>
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">High school or GED</button>
<button type="button" aria-current="true" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 700; color: #663399; background: #EFE0C6; border: 0; border-radius: 16px"><span style="flex: 1; min-width: 0">Some college</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#663399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12.500l4.500 4.500L19 7.500"></path></svg></button>
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">Associate degree</button>
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">Bachelor's degree</button>
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">Graduate degree</button>
<button type="button" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; text-align: left; font-size: 15px; font-weight: 500; color: #4A3F52; background: transparent; border: 0; border-radius: 16px">Prefer not to say</button>
</div>
</div>

</div>

<div style="margin-top: auto; padding: 16px 20px 32px; display: flex; gap: 12px">
<button type="button" style="flex: 1; min-width: 0; height: 52px; border: 1.5px solid #663399; border-radius: 999px; background: transparent; color: #663399; font-size: 16px; font-weight: 700">Back</button>
<button type="button" style="flex: 2; min-width: 0; height: 52px; border: 0; border-radius: 999px; background: #663399; color: #FFFFFF; font-size: 16px; font-weight: 700">Next</button>
</div>

</div>
</x-dc>

</body>
</html>
